name: O Stats
description: Adds O stats to the stats page
version: 2.2
url: https://discourse.stashapp.cc/t/o-stats/4766/7
ui:
  css:
    - ostats.css
  javascript:
    - ostats.js
  assets:
    /: .
settings:
  00_hideImageOs:
    displayName: "Hide Image O's"
    type: BOOLEAN
    description: Leaves O's on images out of the stats. When shown, they count toward O's Today, the streak, Most O's in One Day, the O graph and the O Calendar, appear as orange markers on the On This Day timeline and in its Content Viewed list, and get their own Image with Most O's highlight. Average min/O only counts O's on scenes, since images have no watch time. The time of every O on an image is saved even while this is on. Default false.
  01_hideTopStats:
    displayName: 'Hide Today & Weekly'
    type: BOOLEAN
    description: Hides the whole Today & Weekly row (O's, streak, watch time, videos watched and average min/O, today and this week). Default false.
  02_hideTopStatsOsToday:
    displayName: "[Today & Weekly] Hide O's Today"
    type: BOOLEAN
    description: Hides the O's Today stat. Has no effect if Hide Today & Weekly is on. Default false.
  04_hideTopStatsStreak:
    displayName: '[Today & Weekly] Hide Streak'
    type: BOOLEAN
    description: Hides the Streak stat. Has no effect if Hide Today & Weekly is on. Default false.
  04a_hideTodayWatchTime:
    displayName: '[Today & Weekly] Hide Watch Time Today'
    type: BOOLEAN
    description: Hides the Watch Time Today stat. Has no effect if Hide Today & Weekly is on. Default false.
  04b_hideTodayVideosWatched:
    displayName: '[Today & Weekly] Hide Videos Watched Today'
    type: BOOLEAN
    description: Hides the Videos Watched Today stat. Has no effect if Hide Today & Weekly is on. Default false.
  04c_hideTodayAvgMinPerO:
    displayName: '[Today & Weekly] Hide Avg min/O'
    type: BOOLEAN
    description: Hides the Avg min/O card (watch time per O today and this week). Has no effect if Hide Today & Weekly is on. Default false.
  04d_hideThisWeek:
    displayName: '[Today & Weekly] Hide This Week'
    type: BOOLEAN
    description: Shows only today in the Today & Weekly cards, without this week's totals, day-by-day bars and comparisons with last week and a usual week. Default false.
  06a_hideAllTimeStats:
    displayName: 'Hide All Time & Records'
    type: BOOLEAN
    description: Hides the whole All Time & Records row (total O's, total plays, total play duration, most O's in one day, most time spent in one day and average min/O). Default false.
  06b_hideTopStatsRecordDay:
    displayName: "[All Time & Records] Hide Most O's in One Day"
    type: BOOLEAN
    description: Hides the Most O's in One Day stat. Has no effect if Hide All Time & Records is on. Default false.
  06c_hideTopStatsRecordSession:
    displayName: '[All Time & Records] Hide Most Time Spent in One Day'
    type: BOOLEAN
    description: Hides the Most Time Spent in One Day stat (most watch time in a single day). Has no effect if Hide All Time & Records is on. Default false.
  06d_hideTopStatsAverageMinPerO:
    displayName: '[All Time & Records] Hide Average min/O'
    type: BOOLEAN
    description: Hides the Average min/O stat. Has no effect if Hide All Time & Records is on. Default false.
  07_hideSceneHighlights:
    displayName: Hide Highlights
    type: BOOLEAN
    description: Hides the whole Highlights row (scene with most O's, longest play duration, most recent O, oldest O and image with most O's). Default false.
  08_hideSceneHighlightsMostOs:
    displayName: "[Highlights] Hide Scene with Most O's"
    type: BOOLEAN
    description: Hides the Scene with Most O's highlight. Has no effect if Hide Highlights is on. Default false.
  09_hideSceneHighlightsLongestPlay:
    displayName: '[Highlights] Hide Longest Play Duration'
    type: BOOLEAN
    description: Hides the Longest Play Duration highlight. Has no effect if Hide Highlights is on. Default false.
  10_hideSceneHighlightsMostRecentO:
    displayName: '[Highlights] Hide Most Recent O'
    type: BOOLEAN
    description: Hides the Most Recent O highlight. Has no effect if Hide Highlights is on. Default false.
  11_hideSceneHighlightsOldestO:
    displayName: '[Highlights] Hide Oldest O'
    type: BOOLEAN
    description: Hides the Oldest O highlight. Has no effect if Hide Highlights is on. Default false.
  11a_hideHighlightsMostOImage:
    displayName: "[Highlights] Hide Image with Most O's"
    type: BOOLEAN
    description: Hides the Image with Most O's highlight. It never shows with Hide Image O's on. Has no effect if Hide Highlights is on. Default false.
  12_hideOGraph:
    displayName: Hide O Graph
    type: BOOLEAN
    description: Hides the O count bar graph. Default false.
  13_hideWatchTimeGraph:
    displayName: Hide Watch Time Graph
    type: BOOLEAN
    description: Hides the watch time bar graph. Default false.
  13a_hideOCalendar:
    displayName: Hide O Calendar
    type: BOOLEAN
    description: Hides the O Calendar heatmap under the watch time graph. Default false.
  13b_hideWatchCalendar:
    displayName: Hide Watch Calendar
    type: BOOLEAN
    description: Hides the Watch Calendar heatmap under the O Calendar. Default false.
  14_hideWhatWorks:
    displayName: Hide What Works for You
    type: BOOLEAN
    description: Hides the What Works for You section, which ranks your top performers, tags and studios by O's or by views. Default false.
  15_hideOnThisDay:
    displayName: Hide On This Day
    type: BOOLEAN
    description: Hides the whole On This Day section, including its stats. Default false.
  16_hideOnThisDayTimelineOs:
    displayName: "[On This Day] Hide O's On Timeline"
    type: BOOLEAN
    description: Hides the blue O markers on the On This Day timeline. Default false.
  17_showOnThisDayTimelineWatches:
    displayName: '[On This Day] Show Watches On Timeline'
    type: BOOLEAN
    description: Shows gray markers on the On This Day timeline for videos you watched without an O. Hover to see the thumbnail, click to open the scene. Default false.
  20_hideOnThisDayStats:
    displayName: '[On This Day] Hide Stats'
    type: BOOLEAN
    description: Hides the stats at the bottom of the On This Day section (O's, watch time, videos watched and average min/O). Default false.
  21_showLibraryStats:
    displayName: Show Library Stats
    type: BOOLEAN
    description: Shows the Library section at the bottom of the page (scenes, images, galleries, performers, studios, groups and tags). Default false.
  22_hideExportImportButtons:
    displayName: Hide Export/Import Buttons
    type: BOOLEAN
    description: Hides the Export JSON and Import JSON buttons at the bottom of the page. Default false.

# Run by the stats page, the scene player and image O's (runPluginOperation)
# to read and save watch time and image O's; see osaver.py
exec:
  - python
  - '{pluginDir}/osaver.py'
interface: raw
